<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Linked List Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Circular Linked List Visualizer</h1>
            <p>Interactive visualization of circular linked list operations</p>
        </div>

        <!-- Message Display -->
        <div id="message" class="message hidden"></div>

        <!-- Visualization Area -->
        <div class="visualization-area">
            <svg id="circularList" class="circular-svg" viewBox="0 0 600 600">
                <g id="nodesGroup"></g>
                <g id="arrowsGroup"></g>
            </svg>
            <div class="empty-message" id="emptyMessage">List is empty - Add some nodes!</div>
            <div class="node-count">Nodes: <span id="nodeCount">0</span>/10</div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <!-- Insert Operations -->
            <div class="control-box">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Insert Node
                </h3>
                <div class="input-group">
                    <input type="text" id="insertValue" placeholder="Enter value" class="input-field">
                    <select id="insertPosition" class="input-field">
                        <option value="beginning">At Beginning</option>
                        <option value="end">At End</option>
                        <option value="position">At Position</option>
                    </select>
                    <button onclick="insertNode()" class="btn btn-insert">Insert</button>
                </div>
            </div>

            <!-- Delete Operations -->
            <div class="control-box">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    Delete Node
                </h3>
                <div class="input-group">
                    <select id="deletePosition" class="input-field" onchange="toggleDeleteInput()">
                        <option value="beginning">From Beginning</option>
                        <option value="end">From End</option>
                        <option value="value">By Value</option>
                    </select>
                    <input type="text" id="deleteValue" placeholder="Enter value to delete" class="input-field hidden">
                    <button onclick="deleteNode()" class="btn btn-delete">Delete</button>
                </div>
            </div>

            <!-- Search Operation -->
            <div class="control-box">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    Search Node
                </h3>
                <div class="input-group">
                    <input type="text" id="searchValue" placeholder="Enter value to search" class="input-field">
                    <button onclick="searchNode()" class="btn btn-search">Search</button>
                </div>
            </div>

            <!-- Other Operations -->
            <div class="control-box">
                <h3>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    Other Operations
                </h3>
                <div class="input-group">
                    <button onclick="traverseList()" class="btn btn-traverse">Traverse List</button>
                    <button onclick="checkEmpty()" class="btn btn-check">Check if Empty</button>
                    <button onclick="checkFull()" class="btn btn-check-full">Check if Full</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
